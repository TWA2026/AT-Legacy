version: 1

# What runs on Slipway for this repo:
#
#   at-legacy  The earlier public site (static files in legacy-site/).
#              It serves atlegacyservices.com until the hub takes over.
#   hub        The quote hub's public side: pages, request API, and the private
#              quote pages for customers and partners.
#   dashboard  The owner's dashboard. Same app, serving only /admin, behind
#              Slipway's sign-in wall (auth: members).
#
# The hub's Postgres database is a managed database named "db" in the same
# Slipway project. It is created in Slipway, not declared here.
#
# Slipway keeps its own copy of this spec for the project, and that copy is
# what deploys. A change here needs the same change there. Custom domains and
# the address settings (PUBLIC_URL, DASHBOARD_URL) are also set in Slipway. See "Deploy on Slipway" in README.md.

services:
  - name: at-legacy
    type: static
    rootDir: .
    runtime: node
    runtimeVersion: "22"
    buildCommand: npm run build
    publish: dist

  - name: hub
    rootDir: .
    runtime: node
    runtimeVersion: "22"
    buildCommand: npm ci --omit=dev
    command: ["node", "server/index.js"]
    preDeploy: ["node", "server/migrate.js"]
    ports:
      - port: 3000
        public: true
    healthCheckPath: /healthz
    cpu: 250m
    memory: 512Mi
    env:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${service.db.url}

  - name: dashboard
    rootDir: .
    runtime: node
    runtimeVersion: "22"
    buildCommand: npm ci --omit=dev
    command: ["node", "server/index.js"]
    ports:
      - port: 3000
        public: true
    healthCheckPath: /healthz
    cpu: 100m
    memory: 256Mi
    auth:
      members: true
    env:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${service.db.url}
      DASHBOARD_ONLY: "1"
      ADMIN_SIGNIN: host
