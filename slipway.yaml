version: 1

# What runs on Slipway for this repo:
#
#   at-legacy  A static copy of the public pages in site/, served at
#              atlegacyservices.com. Its forms send to the hub.
#   hub        The quote hub's public side: pages, request API, and the private
#              quote pages for customers and partners.
#   dashboard  The owner's dashboard. Same app, serving only /admin, behind
#              Slipway's sign-in wall (auth: members).
#
# The hub's Postgres database is a managed database named "db" in the same
# Slipway project. It is created in Slipway, not declared here.
#
# Slipway keeps its own copy of this spec for the project, and that copy is
# what deploys. A change here needs the same change there. Custom domains and
# the address settings (PUBLIC_URL, DASHBOARD_URL, SITE_ORIGINS) are also set
# in Slipway. See "Deploy on Slipway" in README.md.
#
# Secrets are never written here. STRIPE_SECRET_KEY, which turns on online
# payment of invoices, is added in Slipway as a secret on the hub service.

services:
  - name: at-legacy
    type: static
    rootDir: .
    runtime: node
    runtimeVersion: "22"
    buildCommand: npm run build:site
    publish: dist
    # The same protections the hub sends with its own pages, plus permission to call the hub.
    headers:
      - for: /*
        values:
          Content-Security-Policy: "default-src 'self'; img-src 'self' data:; connect-src 'self' https://hub-00dd216e.onslipway.sh; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
          X-Content-Type-Options: nosniff
          X-Frame-Options: DENY
          Referrer-Policy: no-referrer
    # Private links and the dashboard live on the hub and dashboard services.
    redirects:
      - from: /admin
        to: https://dashboard-7ac3f48e.onslipway.sh/admin
        status: 302
      - from: /admin/*
        to: https://dashboard-7ac3f48e.onslipway.sh/admin/:splat
        status: 302
      - from: /r/*
        to: https://hub-00dd216e.onslipway.sh/r/:splat
        status: 302
      - from: /q/*
        to: https://hub-00dd216e.onslipway.sh/q/:splat
        status: 302

  - name: hub
    rootDir: .
    runtime: node
    runtimeVersion: "22"
    buildCommand: npm ci --omit=dev
    command: ["node", "server/index.js"]
    preDeploy: ["node", "server/migrate.js"]
    ports:
      - port: 3000
        public: true
    healthCheckPath: /healthz
    cpu: 250m
    memory: 512Mi
    env:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${service.db.url}

  - name: dashboard
    rootDir: .
    runtime: node
    runtimeVersion: "22"
    buildCommand: npm ci --omit=dev
    command: ["node", "server/index.js"]
    ports:
      - port: 3000
        public: true
    healthCheckPath: /healthz
    cpu: 100m
    memory: 256Mi
    auth:
      members: true
    env:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${service.db.url}
      DASHBOARD_ONLY: "1"
      ADMIN_SIGNIN: host
